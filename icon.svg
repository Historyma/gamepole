<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5BA8E8"/>
      <stop offset="1" stop-color="#2B6CB8"/>
    </linearGradient>
  </defs>

  <!-- Синій заокруглений квадрат -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Біла заокруглена рамка -->
  <rect x="200" y="220" width="624" height="584" rx="100"
        fill="none" stroke="#fff" stroke-width="44"/>

  <!-- Вертикальні лінії сітки -->
  <line x1="408" y1="220" x2="408" y2="804" stroke="#fff" stroke-width="32"/>
  <line x1="616" y1="220" x2="616" y2="804" stroke="#fff" stroke-width="32"/>

  <!-- Горизонтальні лінії сітки -->
  <line x1="200" y1="414" x2="824" y2="414" stroke="#fff" stroke-width="32"/>
  <line x1="200" y1="610" x2="824" y2="610" stroke="#fff" stroke-width="32"/>

  <!-- Цифра 9 -->
  <text x="512" y="608" font-family="Arial, Helvetica, sans-serif"
        font-size="240" font-weight="900" fill="#fff" text-anchor="middle">9</text>
</svg>
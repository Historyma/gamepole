<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoku Game</title>

    <!-- Основний файл стилів -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Верхня панель -->
        <header class="top-bar">
            <div class="logo">
                <span class="logo-icon">🧩</span>
                <h1>Sudoku</h1>
            </div>

            <div class="score-card">
                <span class="score-label">Бали</span>
                <strong id="score">0</strong>
                <span class="star">⭐</span>
            </div>
        </header>


        <!-- Інформація про поточний рівень -->
        <section class="game-info">

            <div class="info-card">
                <span class="info-label">Рівень</span>
                <strong id="level">1</strong>
            </div>

            <div class="info-card">
                <span class="info-label">Складність</span>
                <strong id="difficulty">Легко</strong>
            </div>

            <div class="info-card">
                <span class="info-label">Час</span>
                <strong id="timer">00:00</strong>
            </div>

        </section>


        <!-- Вибір розміру поля -->
        <section class="size-selector">

            <p>Оберіть розмір поля</p>

            <div class="size-buttons">

                <button class="size-btn active" data-size="4">
                    4 × 4
                    <small>Легко</small>
                </button>

                <button class="size-btn" data-size="6">
                    6 × 6
                    <small>Середньо</small>
                </button>

                <button class="size-btn" data-size="9">
                    9 × 9
                    <small>Класика</small>
                </button>

            </div>

        </section>


        <!-- Ігрове поле -->
        <section class="game-container">

            <div
                id="sudoku-board"
                class="sudoku-board"
                aria-label="Ігрове поле Sudoku"
            ></div>

        </section>


        <!-- Панель вибору цифр -->
        <section class="number-panel">

            <div id="number-buttons" class="number-buttons"></div>

        </section>


        <!-- Кнопки керування -->
        <section class="game-controls">

            <button id="new-game-btn" class="control-btn primary">
                🔄 Нова гра
            </button>

            <button id="check-btn" class="control-btn secondary">
                ✓ Перевірити
            </button>

        </section>


        <!-- Повідомлення про результат -->
        <div id="message" class="message" role="status"></div>

    </main>


    <!-- Вікно перемоги -->
    <div id="win-modal" class="modal hidden">

        <div class="modal-content">

            <div class="win-icon">🏆</div>

            <h2>Вітаємо!</h2>

            <p id="win-text">
                Ви успішно пройшли рівень!
            </p>

            <div class="points-earned">
                +<span id="earned-points">1</span> ⭐
            </div>

            <button id="next-level-btn" class="control-btn primary">
                Наступний рівень →
            </button>

        </div>

    </div>


    <!-- Підключаємо логіку гри -->
    <script src="script.js"></script>

</body>
</html>
